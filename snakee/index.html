<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🐍 Snake Game</h1>

    <div class="game-container">

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <p>Score: <span id="score">0</span></p>

        <!-- Mobile Controls -->
        <div class="controls">
            <button onclick="changeDirection('UP')">⬆️</button>

            <div>
                <button onclick="changeDirection('LEFT')">⬅️</button>
                <button onclick="changeDirection('DOWN')">⬇️</button>
                <button onclick="changeDirection('RIGHT')">➡️</button>
            </div>
        </div>

        <button class="restart" onclick="restartGame()">
            Restart Game
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
